name: Build

# DayLight Creative Technologies fork. SocialScoreKeeper pins this fork by commit SHA, and its
# `scripts/check_fork_ci_green.py` (gate #76) requires the pinned commit to have a green run of this
# workflow in which the job named "SwiftPM build (iOS)" succeeded. Renaming that job breaks the gate, by design.
#
# A push to the default branch starts a run; it can also be dispatched by hand:
#   gh workflow run build.yml --repo DayLight-Creative-Technologies/dlct_msal_auth --ref main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The plugin's Swift package (ios/msal_auth/Package.swift) built by Swift Package Manager in the
  # example app. A plugin whose manifest Flutter cannot use falls back to CocoaPods silently, so the build
  # alone proves nothing: the next step fails unless Flutter's generated plugin package links msal_auth
  # through its Swift package, and the last unless the app carries the package's privacy manifest bundle.
  swiftpm-build-ios:
    name: SwiftPM build (iOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - run: flutter --version
    - run: flutter config --enable-swift-package-manager
    - name: Build the example app with Swift Package Manager (iOS Simulator)
      working-directory: example
      run: |
        flutter pub get
        flutter build ios --simulator --debug
    - name: Fail unless msal_auth linked through its Swift package
      working-directory: example
      run: |
        grep -F '.product(name: "msal-auth", package: "msal_auth")' ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
    - name: Fail unless the app carries msal_auth's privacy manifest
      working-directory: example
      run: test -f build/ios/iphonesimulator/Runner.app/msal_auth_msal_auth.bundle/PrivacyInfo.xcprivacy

  # The CocoaPods build of the same example (ios/msal_auth.podspec), the path an app takes until it builds
  # with Swift Package Manager.
  cocoapods-build-ios:
    name: CocoaPods build (iOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
    - run: flutter --version
    - run: flutter config --no-enable-swift-package-manager
    - name: Build the example app with CocoaPods (iOS Simulator)
      working-directory: example
      run: |
        flutter pub get
        flutter build ios --simulator --debug
